name: Windows Build

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore client/Screencast.Client/Screencast.Client.csproj
      - name: Build
        run: dotnet build client/Screencast.Client/Screencast.Client.csproj -c Release --no-restore
